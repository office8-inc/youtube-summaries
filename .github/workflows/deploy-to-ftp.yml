name: Deploy to FTP on Merge

on:
  push:
    branches: [main]
    paths:
      - 'xserver/summaries/**/*.md'
      - 'xserver/index.html'
      - 'xserver/get_articles.php'
      - 'xserver/marked.min.js'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: '全ファイルをアップロード（通常は変更分のみ）'
        required: false
        type: boolean
        default: false
      paths:
        description: '特定ファイルのみ再送（カンマ区切りのリポジトリ相対パス。転送失敗の復旧用）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-to-ftp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 差分検出のため直前のコミットも取得
      
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      
      - name: Get changed files
        id: changed-files
        run: |
          if [ -n "${{ github.event.inputs.paths }}" ]; then
            # 手動指定モード: 転送だけ失敗したファイルをピンポイントで再送する
            echo "${{ github.event.inputs.paths }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -E '^xserver/' > changed_files.txt || true
            if [ ! -s changed_files.txt ]; then
              echo "mode=none" >> $GITHUB_OUTPUT
              echo "::error::paths に xserver/ 配下の有効なパスがありません"
              exit 1
            fi
            echo "mode=diff" >> $GITHUB_OUTPUT
            echo "手動指定されたファイル:"
            cat changed_files.txt
          elif [ "${{ github.event.inputs.deploy_all }}" == "true" ]; then
            echo "mode=all" >> $GITHUB_OUTPUT
          else
            # PRマージ時も手動実行時も、最新コミットの変更ファイルを取得
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^xserver/' || true)
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "mode=none" >> $GITHUB_OUTPUT
              echo "変更されたファイルはありません"
            else
              echo "mode=diff" >> $GITHUB_OUTPUT
              echo "$CHANGED_FILES" > changed_files.txt
              echo "変更されたファイル:"
              cat changed_files.txt
            fi
          fi
      
      - name: Upload to FTP (差分アップロード)
        if: steps.changed-files.outputs.mode != 'none'
        run: |
          # lftpスクリプトを作成
          cat > upload.lftp << 'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 10
          set net:reconnect-interval-multiplier 1.2
          set net:persist-retries 5
          set cmd:fail-exit yes

          open ftp://${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }}

          EOF

          UPLOAD_COUNT=0
          declare -A MKDIR_DONE

          if [ "${{ steps.changed-files.outputs.mode }}" == "all" ]; then
            echo "⚠️  全ファイルアップロードモード"
            
            # summaries配下の全.mdファイルと.jsonファイル
            while IFS= read -r file; do
              REMOTE_PATH="${file#xserver/summaries/}"
              REMOTE_DIR=$(dirname "$REMOTE_PATH")
              
              if [ "$REMOTE_DIR" != "." ] && [ -z "${MKDIR_DONE[$REMOTE_DIR]:-}" ]; then
                echo "mkdir -p $REMOTE_DIR" >> upload.lftp
                MKDIR_DONE[$REMOTE_DIR]=1
              fi
              echo "put \"$file\" -o \"$REMOTE_PATH\"" >> upload.lftp
              echo "✓ $REMOTE_PATH を追加"
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
            done < <(find xserver/summaries \( -name "*.md" -o -name "*.json" \) -type f)
            
            # xserver直下のファイル
            for file in xserver/index.html xserver/get_articles.php xserver/marked.min.js; do
              if [ -f "$file" ]; then
                FILENAME=$(basename "$file")
                echo "put \"$file\" -o \"$FILENAME\"" >> upload.lftp
                echo "✓ $FILENAME を追加"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              fi
            done
          else
            echo "💡 差分アップロードモード（変更ファイルのみ）"
            
            # 変更されたファイルのみアップロード
            while IFS= read -r file; do
              if [[ "$file" == xserver/summaries/* ]]; then
                REMOTE_PATH="${file#xserver/summaries/}"
                REMOTE_DIR=$(dirname "$REMOTE_PATH")
                
                if [ "$REMOTE_DIR" != "." ] && [ -z "${MKDIR_DONE[$REMOTE_DIR]:-}" ]; then
                  echo "mkdir -p $REMOTE_DIR" >> upload.lftp
                  MKDIR_DONE[$REMOTE_DIR]=1
                fi
                echo "put \"$file\" -o \"$REMOTE_PATH\"" >> upload.lftp
                echo "✓ $REMOTE_PATH を追加 (変更検出)"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              elif [[ "$file" == xserver/* ]]; then
                FILENAME=$(basename "$file")
                echo "put \"$file\" -o \"$FILENAME\"" >> upload.lftp
                echo "✓ $FILENAME を追加 (変更検出)"
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
              fi
            done < changed_files.txt
          fi
          
          echo "bye" >> upload.lftp
          
          # lftpスクリプトを実行
          if [ $UPLOAD_COUNT -gt 0 ]; then
            echo ""
            echo "📤 FTPアップロード中... ($UPLOAD_COUNT ファイル)"

            # Xserver側の一時的な接続拒否で転送が全滅する事故が複数回あったため、
            # セッションごと張り直して粘る（lftp内のリトライだけでは足りなかった）
            ATTEMPT=1
            MAX_ATTEMPT=3
            until lftp -f upload.lftp; do
              if [ $ATTEMPT -ge $MAX_ATTEMPT ]; then
                echo "::error::FTPアップロードが ${MAX_ATTEMPT} 回とも失敗しました（${UPLOAD_COUNT} ファイルがサイトに未反映）"
                exit 1
              fi
              echo "⚠️  試行 ${ATTEMPT}/${MAX_ATTEMPT} 失敗。90秒待って再接続します..."
              sleep 90
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo ""
            echo "✅ $UPLOAD_COUNT ファイルをアップロードしました（試行 ${ATTEMPT}/${MAX_ATTEMPT}）"
          else
            echo "ℹ️  アップロード対象のファイルがありません"
          fi
      
      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## 📊 FTPアップロード完了" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "変更ファイルをXSERVERにアップロードしました。" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ FTPアップロード失敗" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "リポジトリには反映済みだが、**サイトには未反映**。" >> $GITHUB_STEP_SUMMARY
            echo "復旧: このワークフローを workflow_dispatch で実行し、\`paths\` に対象ファイルを指定して再送する。" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 公開URL: https://office8-inc.com/youtube-summaries/" >> $GITHUB_STEP_SUMMARY
