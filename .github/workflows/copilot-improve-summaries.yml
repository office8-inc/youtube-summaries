name: Copilot Improve Summaries

# 【2026-08-05 凍結】push トリガーを停止した。
#
# 2026-08-03 の GitHub 側ランタイム更新以降、アサインされた Copilot coding agent が
# 編集ツールを一度も呼ばずに終了し、0 ファイルの PR を作るようになった
# （#443 / #444 / #446 で再現。ai-news-digest でも同日に同じ症状）。
# 記事は英語プレースホルダーのまま公開され続けるため、改善フェーズを
# crow-bot 側の Claude（_improve_summaries_with_claude）へ移した。
#
# このワークフローを動かすと、Claude が改善した後に不要な issue と空 PR が立つ。
# 復旧手順は ~/.crow-bot/workspace/skills/youtube-summaries/SKILL.md の
# 「Copilot モード（凍結中・復旧したら戻す用）」を参照。
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'xserver/summaries/**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-improvement-issue:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 前のコミットと比較するため
      
      - name: Check if pushed by Copilot
        id: check-author
        run: |
          # 最新のコミット作成者を確認
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "Commit author: $COMMIT_AUTHOR"
          
          # 大文字・小文字を区別せずにチェック
          COMMIT_AUTHOR_LOWER=$(echo "$COMMIT_AUTHOR" | tr '[:upper:]' '[:lower:]')
          
          # CopilotまたはGitHub Actionsによるコミットの場合はスキップ
          if [[ "$COMMIT_AUTHOR_LOWER" == *"copilot"* ]] || [[ "$COMMIT_AUTHOR_LOWER" == *"github-actions"* ]] || [[ "$COMMIT_AUTHOR_LOWER" == *"bot"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Copilotまたはbotによるコミットなのでスキップします: $COMMIT_AUTHOR"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "ユーザーによるコミットです: $COMMIT_AUTHOR"
          fi
      
      - name: Get changed summary files
        id: changed-files
        if: steps.check-author.outputs.skip != 'true'
        run: |
          # 前のコミットと比較して追加・変更されたファイルを取得
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'xserver/summaries/**/*.md' | tr '\n' ' ')
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED_FILES"
          
          # ファイル数をカウント
          if [ -z "$CHANGED_FILES" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
          else
            echo "count=$(echo $CHANGED_FILES | wc -w)" >> $GITHUB_OUTPUT
          fi
      
      - name: Create issue and assign to Copilot
        if: steps.check-author.outputs.skip != 'true' && steps.changed-files.outputs.count > 0
        env:
          # GH_TOKEN: Personal Access Token（Copilotアサインに必要）
          # secrets.GH_TOKEN が設定されていない場合は github.token にフォールバック
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          
          # ファイルリストを作成
          FILE_LIST=$(echo "$FILES" | tr ' ' '\n' | sed 's/^/- `/' | sed 's/$/`/')
          
          # テンプレートファイルを読み込み、Pythonで置換
          export FILE_LIST
          ISSUE_BODY=$(python3 -c "import os; template = open('.github/ISSUE_TEMPLATE/copilot-improve-summary.md', 'r', encoding='utf-8').read(); print(template.replace('REPLACE_WITH_FILES', os.environ['FILE_LIST']))")
          
          # Issueを作成
          ISSUE_TITLE="🤖 要約記事の改善: $(date +'%Y-%m-%d %H:%M')"
          COPILOT_REQUEST="@copilot この要約記事を改善してください。日本語の文章として自然で読みやすい表現に修正し、重要なポイントを強調してください。**重要**: PRを作成する際は、PR本文に「Closes #ISSUE_NUMBER」を含めて、このIssueとリンクさせてください。"
          printf -v FULL_BODY "%s\n\n%s" "$ISSUE_BODY" "$COPILOT_REQUEST"
          ISSUE_URL=$(gh issue create --title "$ISSUE_TITLE" --body "$FULL_BODY" --label "copilot-task,content-improvement")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oP '/\d+$' | tr -d '/')
          
          # GitHub APIでCopilotをアサイン（REST APIでは copilot-swe-agent[bot] を使用）
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/assignees" \
            --input - <<EOF || echo "⚠️ Copilotの自動アサインに失敗（Issue本文の@copilotメンションで起動します）"
          {
            "assignees": ["copilot-swe-agent[bot]"],
            "agent_assignment": {
              "target_repo": "${{ github.repository }}",
              "base_branch": "main",
              "custom_instructions": "",
              "custom_agent": "",
              "model": ""
            }
          }
          EOF
          
          echo "✅ Issue #$ISSUE_NUMBER を作成しました: $ISSUE_URL"
      
      - name: Summary
        if: always()
        run: |
          echo "## 📊 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 検出ファイル数: ${{ steps.changed-files.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changed-files.outputs.count }}" -gt "0" ]; then
            echo "- ステータス: ✅ Copilotにタスクをアサインしました" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 対象ファイル" >> $GITHUB_STEP_SUMMARY
            for file in ${{ steps.changed-files.outputs.files }}; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "- ステータス: ℹ️ 新規要約ファイルはありません" >> $GITHUB_STEP_SUMMARY
          fi
